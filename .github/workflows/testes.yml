# Roda as partidas de teste a cada envio de código: se algo quebrar, o GitHub avisa antes de virar versão.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
